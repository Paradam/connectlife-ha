# Hisense WD5i1215-RDB001 washer/dryer
# Device type: 025
# Feature code: 1wj120703d0f
#
# Program/options are derived from ConnectLife's getDeviceFunctionList response
# for this feature code and checked against observed live appliance states.
# Unspecified fields inherit from 025.yaml.
#
# Program-dependent controls use available_when so unsupported controls remain
# registered but become unavailable for the selected program. Selects whose
# legal values vary by program use options_when to expose only values accepted
# by the current program.

properties:
  - property: Current_program_phase
    sensor:
      device_class: enum
      options:
        0: not_available
        1: weigh
        2: prewash
        3: wash
        4: rinsing
        7: spinning
        8: drying
        10: finished

  # This property is a relative 0-100 energy estimate for the selected program,
  # not an energy meter. Values of 50 and 100 have been observed.
  - property: Energy_estimate
    sensor:
      device_class: power_factor
      unit: null
      state_class: null

  # Reported in tenths of a kilogram (e.g. 80 = 8.0 kg, 60 = 6.0 kg).
  - property: washing_program_kg
    sensor:
      multiplier: 0.1

  # Reported as the hundreds-of-RPM value (15 = 1500 RPM).
  - property: washing_machine_type_max_speed
    sensor:
      multiplier: 100

  # This model reports an internal/default index here (e.g. 7), not literal RPM.
  - property: DefaultSpinSpeed
    sensor:
      unit: null

  - property: Selected_program_ID
    select:
      options:
        1: cotton_dry
        2: synthetic_dry
        4: refresh
        6: drum_clean
        7: cotton
        8: synthetic
        9: eco
        10: wool
        11: quick_15
        12: mix
        14: spin
        15: allergy_care
        16: baby_care
        18: sportswear
        19: down
        20: rinse_spin
        21: delicates
        22: wash_and_dry_49
        24: shirts
        44: bedding
        51: ai_super_wash
        52: power_39
        56: pets
        85: time_dry
        86: wash_and_dry_96

  - property: Spin_speed_rpm
    available_when:
      Selected_program_ID: [1, 2, 6, 7, 8, 9, 10, 11, 12, 14, 15, 16, 18, 19, 20, 21, 22, 24, 44, 52, 56, 86]
    select:
      options:
        0: none
        4: "400"
        6: "600"
        8: "800"
        10: "1000"
        12: "1200"
        15: "1500"
      options_when:
        - when:
            Selected_program_ID: 6
          options:
            8: "800"
        - when:
            Selected_program_ID: [10, 19, 21]
          options:
            0: none
            4: "400"
            6: "600"
        - when:
            Selected_program_ID: 11
          options:
            0: none
            4: "400"
            6: "600"
            8: "800"
            15: "1500"
        - when:
            Selected_program_ID: [22, 86]
          options:
            8: "800"
            15: "1500"

  - property: DryModel
    available_when:
      Selected_program_ID: [7, 8, 9, 10, 11, 12, 14, 15, 16, 18, 19, 20, 21, 22, 24, 44, 51, 52, 56, 86]
    optional: false
    entity_category: null
    icon: mdi:washing-machine
    select:
      options:
        0: wash
        1: wash_and_dry
        2: dry_only
      options_when:
        - when:
            Selected_program_ID: [9, 11, 14, 20, 22, 24, 52, 86]
          options:
            0: wash
            1: wash_and_dry

  # The app uses this property for both automatic dry levels and timed drying.
  - property: dry_time
    available_when:
      Selected_program_ID: [1, 2, 4, 7, 8, 9, 10, 12, 14, 15, 16, 18, 19, 20, 21, 24, 44, 52, 56, 85]
    select:
      options:
        1: iron
        2: cupboard
        3: extra_dry
        5: eco
        15: 15_min
        30: 30_min
        45: 45_min
        60: 60_min
        90: 90_min
        120: 120_min
        180: 180_min
        240: 240_min
      unknown_value: 0
      options_when:
        - when:
            Selected_program_ID: 1
          options:
            1: iron
            2: cupboard
            3: extra_dry
            5: eco
            30: 30_min
            60: 60_min
            90: 90_min
            120: 120_min
            180: 180_min
            240: 240_min
        - when:
            Selected_program_ID: [2, 7, 8, 9, 12, 14, 15, 16, 18, 19, 20, 24, 44, 52, 56]
          options:
            1: iron
            2: cupboard
            3: extra_dry
            30: 30_min
            60: 60_min
            90: 90_min
            120: 120_min
            180: 180_min
            240: 240_min
        - when:
            Selected_program_ID: 4
          options:
            15: 15_min
            30: 30_min
            45: 45_min
        - when:
            Selected_program_ID: 10
          options:
            60: 60_min
            90: 90_min
            120: 120_min
            180: 180_min
        - when:
            Selected_program_ID: 21
          options:
            15: 15_min
            30: 30_min
            45: 45_min
            60: 60_min
        - when:
            Selected_program_ID: 85
          options:
            15: 15_min
            30: 30_min
            60: 60_min
            90: 90_min
            120: 120_min

  - property: temperature
    available_when:
      Selected_program_ID: [6, 7, 8, 9, 10, 11, 12, 15, 16, 18, 19, 21, 22, 24, 44, 52, 56, 86]
    select:
      options:
        0: cold
        2: "20"
        3: "30"
        4: "40"
        6: "60"
        9: "90"
      options_when:
        - when:
            Selected_program_ID: 6
          options:
            9: "90"
        - when:
            Selected_program_ID: 7
          options:
            0: cold
            2: "20"
            3: "30"
            4: "40"
            6: "60"
            9: "90"
        - when:
            Selected_program_ID: [8, 12, 24, 44, 56]
          options:
            0: cold
            2: "20"
            3: "30"
            4: "40"
            6: "60"
        - when:
            Selected_program_ID: [9, 22]
          options:
            0: cold
        - when:
            Selected_program_ID: [10, 11, 18, 19, 21, 52, 86]
          options:
            0: cold
            2: "20"
            3: "30"
            4: "40"
        - when:
            Selected_program_ID: 15
          options:
            6: "60"
        - when:
            Selected_program_ID: 16
          options:
            4: "40"
            6: "60"
            9: "90"

  - property: DelayEndTime
    select:
      options:
        0: none
        1: 1_hour
        2: 2_hours
        3: 3_hours
        4: 4_hours
        5: 5_hours
        6: 6_hours
        7: 7_hours
        8: 8_hours
        9: 9_hours
        10: 10_hours
